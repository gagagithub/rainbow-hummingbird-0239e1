<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日榜单 - 香港保险 & 存款</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f5f5; color:#333; line-height:1.6; padding:20px; }
    .container { max-width:1200px; margin:0 auto; }
    h1 { text-align:center; color:#1a1a2e; margin-bottom:8px; font-size:1.8em; }
    .date { text-align:center; color:#666; margin-bottom:24px; font-size:0.95em; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
    .col { background:white; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
    .ch { padding:14px 20px; font-size:1.05em; font-weight:700; text-align:center; }
    .col:first-child .ch { background:#6366f1; color:white; }
    .col:last-child .ch { background:#f59e0b; color:white; }
    .cs { padding:12px 18px; border-bottom:1px solid #f0f0f0; }
    .cs:last-child { border-bottom:none; }
    .cpt { font-size:0.75em; font-weight:600; color:#999; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px; }
    table { width:100%; border-collapse:collapse; font-size:0.82em; }
    th { display:none; }
    td { padding:5px 6px; border-bottom:1px solid #f8f8f8; vertical-align:top; }
    td:first-child { color:#ccc; width:18px; }
    td:nth-child(2) { font-weight:500; line-height:1.35; }
    td:last-child { color:#fe2c55; font-weight:600; white-space:nowrap; text-align:right; font-size:0.78em; }
    tr:last-child td { border-bottom:none; }
    .tl { color:#222; text-decoration:none; font-weight:500; }
    .tl:hover { color:#1877f2; text-decoration:underline; }
    .m { color:#888; font-size:0.88em; }
    .alert { background:#fff3cd; color:#856404; padding:8px 12px; border-radius:6px; font-size:0.82em; }
    .footer { text-align:center; color:#aaa; font-size:0.8em; margin-top:24px; }
    @media (max-width:700px) { .two-col { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🇭🇰 每日热门内容榜单</h1>
    <div class="date">2026-04-06 · 抖音 / 小红书 / Bilibili / 微信视频号 / 西瓜视频</div>
    <div class="two-col">
      <div class="col"><div class="ch">🔍 香港保险</div><div class="cs"><div class="cpt">📹 抖音</div><div class="alert">暂无数据</div></div><div class="cs"><div class="cpt">📕 小红书</div><div class="alert">暂无数据</div></div><div class="cs"><div class="cpt">📺 B站</div><div class="alert">暂无数据</div></div><div class="cs"><div class="cpt">💬 视频号</div><div class="alert">暂无数据</div></div><div class="cs"><div class="cpt">🎬 西瓜</div><div class="alert">暂无数据</div></div></div>
      <div class="col"><div class="ch">🔍 存款</div><div class="cs"><div class="cpt">📹 抖音</div><div class="alert">暂无数据</div></div><div class="cs"><div class="cpt">📕 小红书</div><div class="alert">暂无数据</div></div><div class="cs"><div class="cpt">📺 B站</div><div class="alert">暂无数据</div></div><div class="cs"><div class="cpt">💬 视频号</div><div class="alert">暂无数据</div></div><div class="cs"><div class="cpt">🎬 西瓜</div><div class="alert">暂无数据</div></div></div>
    </div>
    <div class="footer">
      <p>🔄 每日9:00自动更新 · GitHub Pages</p>
    </div>
  </div>
</body>
</html>
